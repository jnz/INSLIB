# Worst-case stack usage analysis of the INSLIB core library (make stack).
# Directives: see the header of scripts/stack_usage.py.
#
# This file holds what applies to every build of the library, plus the
# figures and budgets for an x86_64 host with glibc, which is what `make
# stack` in the top level Makefile analyses by default.

root ins_* ahrs_* baro_alt_* local_gnss_alt_* nav_suite_* magnetic_* log_*

# log_write calls the installed sink. The default sink is analysed, a sink
# installed with log_set_sink() is represented by LOG_USER_SINK, whose
# assumed figure is the stack a user sink may use.
indirect log_write src/log.c:default_sink LOG_USER_SINK
extern LOG_USER_SINK 256

# Covers compiler generated helper calls without a call graph edge, which
# some GCC releases do not record.
margin 64

# --- x86_64 host (glibc) ----------------------------------------------------
# Assumed, not measured, and generous. They are constants, so a change in
# the budgets below still comes from the library itself.
extern __assert_fail        4096
extern __ctype_tolower_loc  64
extern acosf                512
extern asinf                512
extern atan2                1024
extern atan2f               512
extern cosf                 512
extern fmax                 64
extern fmaxf                64
extern fminf                64
extern fmodf                256
extern memcpy               64
extern memmove              64
extern memset               64
extern powf                 512
extern printf               2048
extern putchar              512
extern sin                  1024
extern sincos               1024
extern sincosf              1024
extern sinf                 512
extern snprintf             2048
extern sqrt                 64
extern sqrtf                64
extern vfprintf             2048
extern vprintf              2048

# Budgets, roughly 10 to 15 percent above the figures of GCC 14.2 at -O2, so
# a different GCC release passes while a new large frame on the per-epoch
# path does not. The per-epoch paths peak in kalman_udu_predict, whose
# scratch matrices are sized for the largest state vector, and end in the
# assert handler (KFCore's asserts are active without NDEBUG). Those scratch
# matrices follow KALMAN_MAX_STATE_SIZE/KALMAN_MAX_NOISE_SIZE, which the
# Makefile lowers from KFCore's defaults to the dimensions INSLIB actually
# uses, so the budgets below assume that build.
budget x86_64-* nav_suite_update        14500
budget x86_64-* nav_suite_predict_step  14500
budget x86_64-* nav_suite_correct_step  10000
budget x86_64-* ins_update              13500
budget x86_64-* ins_predict_step        13500
budget x86_64-* ins_correct_step        7300
budget x86_64-* ahrs_update             9300
budget x86_64-* ahrs_predict_step       9300
budget x86_64-* ahrs_correct_step       6000
budget x86_64-* baro_alt_update         8900
budget x86_64-* baro_alt_predict_step   8900
budget x86_64-* baro_alt_correct_step   5400
budget x86_64-* baro_alt_zero_velocity_update 5400
budget x86_64-* *                       5000
