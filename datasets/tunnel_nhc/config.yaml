# Car with X20P (Galileo HAS active) and ICM-45686 IMU driving through the
# Wattkopf tunnel, in the opposite direction to datasets/tunnel (REQ-VER-031).
# Main goal of this test: bridge the GNSS outage through the tunnel.
#
# Block-averaged from 800 Hz IMU data to 200 Hz to save Git repo storage
# space (tools/inslib_decimate_dataset.py), and trimmed to the stretch from
# the first fix to 30 s after the tunnel exit.
#
# Outage is 97.8 s (t_rel 587.7 to 685.5), 1877 m chord, 15 to 21 m/s,
# descent 17 m.
#
# ref.csv is the original GNSS data (the same data as in gnss.csv).
# No true reference in the tunnel.
# Scoring metric is the first fix after the tunnel exit (REQ-VER-029).

name: tunnel_nhc
aiding: gnss
init: auto
chi2_disable: 0

# Longer than default dead reckoning time required
max_deadreckoning_sec: 150.0

# Automotive Mode is important
automotive_mode: 1
# Stronger believe in the automotive mode heading from GNSS velocity
automotive_min_yaw_stddev_deg: 5.0
# Enable non-holonomic lateral constraints (REQ-NAV-077)
automotive_lateral_constraint: 1

mag:
  enable: 1
  wmm_year: 2026.7  # WMM epoch, from the capture's own NAV-PVT date

baro:
  acc_bias_init_mps2: 0.05
  stddev_m: 2.0
  enable: 1

gnss:
  leverarm_frd: [0.12, 0.6, -0.7]  # IMU to Antenna offset
  delay_ms: 200

imu:
  gyr_psd: 2.5e-08
  acc_psd: 2.0e-05
  # FIXME bias random walk not measured for this sensor
  gyr_bias_rw: 1.0e-06
  acc_bias_rw: 1.0e-05

  pos_pred_stddev_m_sqrts: 0.05         # more process noise helps a bit
  auto_zupt_static_gyr_stddev_deg: 0.2  # engine vibration ZUPT tuning

score:
  warmup_sec: 30.0
  min_epochs: 1000
  ahrs: 0
  attitude: 0
  ref_delay_ms: 200.0 # ref.csv has a 200 ms delay
  # Don't score total RMS (no ground truth in tunnel available)
  lim_pos_rms_m: 0
  lim_ellipsoid_rms_m: 0
  # Score position after tunnel exit (REQ-VER-029).
  coast_gap_min_sec: 30.0
  # The one gate that means something here: how far out the filter is when
  # fixes come back after coasting the whole tunnel. A regression tripwire
  # rather than an accuracy claim: observed 91.7 m (285.5 m with
  # automotive_lateral_constraint 0), limit 1 m above that, so a change that
  # costs the coast a metre fails. The number is reproducible to the
  # millimetre across gcc 11/15, clang 14 and -O0 to -O3 with FMA, so the
  # margin is not there for the compiler. Retighten after an intentional
  # improvement. A run that gives the coasting up has no solution at that
  # epoch and fails this gate rather than skipping it (REQ-VER-029), which is
  # the behaviour the dataset exists to hold on to.
  lim_coast_exit_err_m: 92.7
