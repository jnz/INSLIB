# MEMS ADAHRS data vs. FOG INS
#
# NOTE: ref.csv position/velocity is NOT an independent ground truth - it is
# the SAME GPS solution that also feeds gnss.csv (the aiding). replay's
# position rms therefore measures self-consistency, not absolute accuracy. The
# ATTITUDE truth (ref.csv roll/pitch/yaw) IS independent: it comes from the FOG
# INS solution, a different sensor from the ADAHRS that feeds imu.csv ->
# that comparison is the real benchmark this dataset is for.
#
name: fog
aiding: gnss
init: auto
automotive_mode: 0
gyro_bias_window_sec: 15    # idle from t=0 to ~22 s (GPS speed < 0.02 kt)
auto_init_window_sec: 0.2

init_hint:
  yaw_deg: 119.28        # known heading from ref
  yaw_stddev_deg: 1.0    # supply initial heading

imu:
  rpy_pred_stddev_rad_sqrts: 1.745329252e-05    # rigid mount
  gyr_psd: 2.329e-05   # (rad/s)^2/Hz, allan_variance.py ARW @ tau=1s, 22s parked window
  acc_psd: 0.005799    # (m/s^2)^2/Hz, allan_variance.py ARW @ tau=1s, 22s parked window
  gyr_bias_rw: 6.0e-06 # rad/s/sqrt(s), FIXME: 3x generic MEMS default
  acc_bias_rw: 3.0e-05 # m/s^2/sqrt(s), FIXME: generic MEMS-ish guess

gnss:
  leverarm_frd: [0, 0, 0]        # antenna vs. ADAHRS offset unknown (FIXME)
  # Scored with the combined position+velocity fuse, against the library
  # default (REQ-NAV-063). Not a statement that this receiver's blocks are
  # uncorrelated: the position check on this dataset is a SELF-CONSISTENCY
  # check (see the note at the top - ref.csv position IS the aiding), so
  # any decimation worsens it by construction while saying nothing about
  # accuracy. The fixes also arrive at the full IMU rate here, which is
  # not the receiver behaviour the decimation is aimed at. The simulated
  # Groves profiles, whose GNSS error model IS independent of their truth,
  # are where the option earns its default.
  pos_decimation: 1
  pos_stddev_fallback_m: [3, 5]  # FIXME: no receiver accuracy logged
  vel_stddev_fallback_mps: 0.2   # FIXME: no receiver accuracy logged
  # The fallbacks above are pessimistic placeholders standing in for an
  # accuracy this log never recorded, not a measured quality, so the 3D
  # entry gate (REQ-NAV-051) and the general noise-shutdown gate are both
  # opened up to exactly them -- at the library default (4.0 m vertical)
  # every fix here would fail the shutdown gate on its own fallback stddev
  # and this dataset would never fuse GNSS at all.
  start_max_horizontal_pos_stddev_m: 3.0
  start_max_vertical_pos_stddev_m: 5.0
  max_vertical_pos_stddev_m: 5.0

score:
  leverarm_frd: [0, 0, 0]
  ahrs: 1
  warmup_sec: 30
  min_epochs: 5000
  # Regression guard-rails (~2x one known-good run), not accuracy claims
  # a trip means "we drifted further from the FOG solution than before",
  # not "this is the true error budget". Deterministic real-data replay
  # (no RNG), so these stay tight; retune to a new known-good baseline
  # after an intentional change. lim_pos_rms_m gates self-consistency
  # (see NOTE above), not independent position accuracy.
  lim_att_bias_deg: 0.6        # observed 0.312 (pitch)
  lim_att_std_deg: 0.4         # observed 0.190 (roll)
  lim_yaw_bias_deg: 1.5        # observed 0.766
  lim_yaw_std_deg: 2.8         # observed 1.396
  lim_pos_rms_m: 0.4           # observed 0.181
  lim_ars_att_bias_deg: 0.9    # observed 0.721 (roll), 0.263 (pitch)
  lim_ars_roll_std_deg: 2.2    # observed 1.098
  lim_ars_pitch_std_deg: 3.6   # observed 1.772
  lim_ars_yaw_drift_deg_min: 5.5  # observed 4.397 (see the ARS note above)
