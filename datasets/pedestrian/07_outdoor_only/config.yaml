# generated by inslib_convert_ubx_to_csv.py, IMU rate reduced by
# tools/inslib_decimate_dataset.py -- see info_*.txt
name: pedestrian-07_outdoor_only
aiding: gnss    # NAV-PVT/NAV-COV passthrough, see gnss.csv header
init: auto
automotive_mode: 0    # a pedestrian can step sideways, course over ground is not heading
max_deadreckoning_sec: 300    # long GNSS-denied stretch indoors

imu:
  gyr_psd: 1.218469679e-07    # FIXME: generic MEMS default, replace with datasheet/Allan figures
  acc_psd: 1.178087207e-05
  gyr_bias_rw: 2.0e-06
  acc_bias_rw: 3.0e-05
  acc_misalignment: [1.001037576, 0, 0, -0.0008621933014, 0.9997156924, 0, -0.0001318843448, 4.457193189e-05, 1.000956844]    # col-major 3x3, corrected = M*(raw-bias) (34 degC)
  gyr_misalignment: [1.007804403, 0.0005298074733, 0.001978920293, 0.001232078721, 1.004287541, -0.001657959477, 0.0003292523038, 0.0008676369752, 0.9964990567]    # col-major 3x3, same model (34 degC)
  acc_fixed_bias: [-0.036521, 0.062743, -0.071273]    # m/s^2, multi-position calibration (34 degC)
  gyr_fixed_bias: [0.00266462, 0.00479632, -0.00106585]    # rad/s, static avg (incl. earth rate) (34 degC)

gnss:
  leverarm_frd: [0.02, 0.28, 0.01]    # FIXME: measure antenna vs. IMU on THIS vehicle
  pos_stddev_fallback_m: [5, 10]    # only used for a NAV-COV-less epoch
  vel_stddev_fallback_mps: 0.5
  delay_ms: 200    # replay.py --estimate-gnss-delay

mag:
  enable: 1    # 0x40/0x06 frames in the capture
  stddev_ut: 40
  wmm_year: 2026.6    # WMM epoch, from the capture's own NAV-PVT date
  estimate_bias: 0    # 1 -> 18-state hard-iron estimation on top of the fixed calibration below
  misalignment: [1.044502132, -0.01659610767, -0.02993314727, -0.0624297033, 0.9993665771, -0.01764639892, 0.01391567368, -0.0004522418729, 1.056455967]    # col-major 3x3, soft iron + alignment to the IMU (34 degC)
  fixed_bias: [-18.1494, 18.1106, -20.2816]    # uT, hard iron (34 degC)

baro:
  enable: 1
  stddev_m: 0.5    # FIXME: generic MEMS baro guess
  acc_bias_init_mps2: 0.08


score:
  warmup_sec: 5    # long standstill at the start
  min_epochs: 100
  ahrs: 0    # the reference is another 3D filter, not an independent attitude source for the ARS/AHRS
  attitude: 1    # ref carries a real attitude (a second estimator's, see info_*.txt)
  # regression gates, about twice a known-good run -- not accuracy
  # claims: the reference is a second estimator
  lim_att_bias_deg: 0.5
  lim_att_std_deg: 0.9
  lim_yaw_bias_deg: 5.5
  lim_yaw_std_deg: 7
  lim_pos_rms_m: 0.5
  lim_ellipsoid_rms_m: 0.15

inputs:
  ref: ref_ardupilot.csv
