# generated by crazyflie_reader.py -- live Crazyflie capture
# IMU noise is an approximate BMI088/vibration starting point, refine per airframe from a real log
name: crazyflie
aiding: gnss    # Crazyflie stateEstimate logged as position fixes
init: auto
gyro_bias_window_sec: 3    # harness's historical implicit default, pinned explicitly (no library default exists)
baro_height_disable: 1    # REQ-NAV-053: gnss_pos here is Lighthouse (5/10cm), not
                          # satellite GNSS -- far better than the barometer, keep it
automotive_mode: 1          # 1: derive yaw from GNSS course-over-ground
chi2_disable: 0             # 1: disable outlier downweighting (diagnostics)

imu:
  rpy_pred_stddev_rad_sqrts: 1.745329252e-05    # rigid mount
  gyr_psd: 2.0e-05    # (rad/s)^2/Hz  approx
  acc_psd: 0.001      # (m/s^2)^2/Hz  approx
  gyr_bias_rw: 0.000001    # rad/s/sqrt(s)  approx, refine via allan_variance.py
  acc_bias_rw: 0.000001    # m/s^2/sqrt(s)  approx, refine via allan_variance.py

gnss:
  leverarm_frd: [0, 0, 0]
  pos_stddev_fallback_m: [0.05, 0.1]
  vel_stddev_fallback_mps: 0.1
  # Lighthouse indoor tracking fed through the gnss_pos interface, not
  # satellite GNSS (see baro_height_disable). The library's floor defaults
  # describe an L1 standalone receiver, so they are restated here at what
  # this source actually delivers instead of being switched off.
  pos_stddev_floor_hor_m: 0.05
  pos_stddev_floor_ver_m: 0.10
  vel_stddev_floor_hor_mps: 0.10
  vel_stddev_floor_ver_mps: 0.10
  # Lighthouse reports a pose per frame, not a Doppler velocity averaged
  # over a measurement interval, so the manoeuvre-dependent velocity noise
  # has no error of that kind to price here either.
  vel_noise_acc_scale_hor: -1
  vel_noise_acc_scale_ver: -1

baro:
  enable: 1
  stddev_m: 0.5

mag:
  enable: 1
  stddev_ut: 0.5
  min_delay_ms: -1          # no rate limit: this mag.csv is synthesized from the
                            # CF attitude, not a magnetometer exposed to the platform's
                            # own magnetic disturbances, so the default throttle would
                            # only throw away a clean heading reference
  wmm_year: 2026.530515    # synthesized from CF attitude + WMM

score:
  warmup_sec: 5
  min_epochs: 800
  # Regression guard-rails vs. Lighthouse ground truth: observed + margin,
  # NOT accuracy claims. A trip means inspect, then retune to known-good.
  lim_att_bias_deg: 0.40    # observed 0.241
  lim_att_std_deg: 0.60    # observed 0.439
  lim_yaw_bias_deg: 0.30    # observed 0.128
  lim_yaw_std_deg: 0.90    # observed 0.638
  lim_pos_rms_m: 0.06    # observed 0.033
  leverarm_frd: [0, 0, 0]

origin:
  lat_deg: 49.8728    # fake local-frame anchor
  lon_deg: 8.6512
  h_m: 144

crazyflie:
  uri: radio://0/80/2M/DABADA5503
  yaw_stddev_deg: 5
