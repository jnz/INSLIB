# generated by crazyflie_reader.py (live Crazyflie capture)
# IMU noise should match BMI088/vibration on CF2.1 brushless
name: crazyflie-deadreckoning
aiding: gnss    # Crazyflie lighthouse position measurements
init: auto
gyro_bias_window_sec: 3  # UAV is idle before take-off
allow_unlimited_deadreckoning: 1
chi2_disable: 0
baro_height_disable: 1   # lighthouse altitude is far better than the barometer

imu:
  rpy_pred_stddev_rad_sqrts: 1.745329252e-05 # tuning parameter
  gyr_psd: 0.00001        # (rad/s)^2/Hz  approx
  acc_psd: 0.0002         # (m/s^2)^2/Hz  approx
  gyr_bias_rw: 0.00001    # rad/s/sqrt(s) approx
  acc_bias_rw: 0.00001    # m/s^2/sqrt(s) approx

gnss:
  leverarm_frd: [0, 0, 0]
  pos_stddev_fallback_m: [0.05, 0.1]
  vel_stddev_fallback_mps: 0.1
  # Lighthouse indoor tracking fed through the gnss_pos interface, not
  # satellite GNSS (see baro_height_disable).
  pos_stddev_floor_hor_m: 0.05
  pos_stddev_floor_ver_m: 0.10
  vel_stddev_floor_hor_mps: 0.10
  vel_stddev_floor_ver_mps: 0.10
  # Lighthouse reports a pose per frame, not a velocity measurement
  vel_noise_acc_scale_hor: -1
  vel_noise_acc_scale_ver: -1
  delay_ms: 50
  pos_cov_scale: 0.3

baro:
  enable: 1
  stddev_m: 0.20

mag:
  enable: 1
  stddev_ut: 0.5
  min_delay_ms: -1          # no rate limit: mag.csv is synthesized from the
                            # CF attitude, not a magnetometer exposed
  wmm_year: 2026.530525     # synthesized from CF attitude + WMM

score:
  warmup_sec: 5
  min_epochs: 600
  # Regression guard-rails vs. Lighthouse ground truth: observed + margin,
  # NOT accuracy claims. Trip means inspect and retune.
  lim_att_bias_deg: 0.40   # observed 0.266
  lim_att_std_deg: 0.45    # observed 0.345
  lim_yaw_bias_deg: 0.25   # observed 0.119
  lim_yaw_std_deg: 0.95    # observed 0.722
  lim_pos_rms_m: 0.28      # observed 0.185
  leverarm_frd: [0, 0, 0]  # lighthouse deck is basically next to the CF IMU

origin:
  lat_deg: 49.8728    # fake local-frame anchor
  lon_deg: 8.6512
  h_m: 144

crazyflie:
  uri: radio://0/80/2M/DABADA5503
  yaw_stddev_deg: 5
