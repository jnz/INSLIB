# Source: KF-GINS Leador-A15/RTK-GNSS car trial
# config.yaml: scores against truth.nav (ref.csv) - independent ground truth
# lim_* are provisional regression gates, retune to a known-good run
name: kfgins-leador-a15
aiding: gnss    # real RTK epochs from gnss.csv, position-only
init: auto
automotive_mode: 1
gyro_bias_window_sec: 10    # vehicle idle from starttime to ~+40s, see truth.nav
chi2_disable: 1             # 1: disable outlier downweighting (diagnostics)

init_hint:
  yaw_deg: 185.696     # known heading from ref
  yaw_stddev_deg: 2.0  # supply initial heading precision

imu:
   rpy_pred_stddev_rad_sqrts: 1.745329252e-05    # rigid mount
   gyr_psd: 7.615435495e-13    # (rad/s)^2/Hz, from kf-gins.yaml imunoise.arw (ARW^2, deg/sqrt(hr) -> rad/sqrt(s))
   acc_psd: 2.5e-07    # (m/s^2)^2/Hz, imunoise.vrw (VRW^2)
   gyr_bias_rw: 1.542667687e-09    # rad/s/sqrt(s), imunoise.gbstd + corrtime (GM sigma^2=q*T/2)
   acc_bias_rw: 1.767766953e-06    # m/s^2/sqrt(s), imunoise.abstd + corrtime
   # Stillness detector: the default (0.25 deg/s) admits this vehicle while it
   # is DRIVING, and the auto-ZUPT velocity gate cannot veto that here because
   # this dataset is position-only (no velocity, vel_ok = 0 on all 3413 rows),
   # That leaves the IMU criteria alone to decide, and a navigation-grade FOG
   # in a smoothly cruising car looks a lot like standstill to them - far
   # quieter than the consumer MEMS the shared defaults are sized against
   # (sensor_defaults.h). The result was ZUPTs injected mid-drive: 357 instead
   # of 328, and attitude-error scatter up 30x (roll stddev 0.004 -> 0.120 deg)
   # with the biases unchanged, i.e. the solution did not shift, it got yanked.
   #
   auto_zupt_static_gyr_stddev_deg: 0.10

gnss:
  leverarm_frd: [0.136, -0.301, -0.184]    # kf-gins.yaml antlever (GNSS antenna vs IMU)
  pos_stddev_fallback_m: [1, 2]
  # RTK fixes: gnss.csv reports ~1 cm horizontal / 2 cm vertical and
  # delivers it. The library's floor defaults describe an L1 standalone
  # receiver and would throw that precision away, so they are restated at
  # what this installation actually achieves rather than switched off -
  # an RTK receiver dropping to float still reports optimistically, and a
  # floor sized for the fix mode is what keeps that from being believed.
  pos_stddev_floor_hor_m: 0.02
  pos_stddev_floor_ver_m: 0.03

init_stddev:
  pos_init_stddev_m: 10.0         # kf-gins.yaml initposstd, max component
  vel_init_stddev_mps: 0.5        # initvelstd, max component
  rpy_init_stddev_rad_deg: 2.0    # initattstd roll/pitch
  yaw_init_stddev_rad_deg: 2.0    # initattstd yaw

score:
  leverarm_frd: [0, 0, 0]    # truth.nav/navresult.nav refer to the IMU center, same as the filter state
  ahrs: 1    # no magnetometer in this dataset, but truth roll/pitch/yaw is available -> score the IMU-only ARS too
  warmup_sec: 30
  min_epochs: 3000
  # Regression guard-rails vs. ground truth: observed + margin, NOT accuracy
  # claims. A trip means inspect, then retune to known-good.
  #
  # The ins gates are the original strict ones: the stillness threshold in
  # the imu section above restores the pre-existing accuracy exactly (see
  # there for why this dataset needs it).
  lim_att_bias_deg: 0.005           # observed 0.001 (pitch)
  lim_att_std_deg: 0.01             # observed 0.007 (pitch)
  lim_yaw_bias_deg: 0.012           # observed 0.008
  lim_yaw_std_deg: 0.028            # observed 0.025
  lim_pos_rms_m: 0.029              # observed 0.026
  lim_ars_att_bias_deg: 0.213       # observed 0.202 (roll)
  lim_ars_roll_std_deg: 1.62        # observed 1.571
  lim_ars_pitch_std_deg: 1.57       # observed 1.507
  lim_ars_yaw_drift_deg_min: 0.048  # observed 0.045

inputs:
  ref: ref.csv
