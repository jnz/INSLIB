# generated by convert_kfgins.py -- KF-GINS Leador-A15/RTK-GNSS car trial
# config_kfgins.yaml: scores against KF-GINS's own filtered solution (ref_kfgins.csv), same aiding and noise model as config.yaml -- 'how close do we track KF-GINS', not an independent accuracy check
# lim_* are provisional regression gates, retune to a known-good run
name: kfgins-leador-a15-vs-kfgins
aiding: gnss    # real RTK epochs from gnss.csv, position-only
init: ref    # truth.nav at t0 matches kf-gins.yaml's initpos/initatt within its init stddevs (static alignment already done before starttime)
automotive_mode: 0
gyro_bias_window_sec: 20    # vehicle idle from starttime to ~+40s, see truth.nav

imu:
  rpy_pred_stddev_rad_sqrts: 1.745329252e-05    # rigid mount
  gyr_psd: 7.615435495e-13    # (rad/s)^2/Hz, from kf-gins.yaml imunoise.arw (ARW^2, deg/sqrt(hr) -> rad/sqrt(s))
  acc_psd: 2.5e-07    # (m/s^2)^2/Hz, imunoise.vrw (VRW^2)
  gyr_bias_rw: 1.542667687e-09    # rad/s/sqrt(s), imunoise.gbstd + corrtime (GM sigma^2=q*T/2)
  acc_bias_rw: 1.767766953e-06    # m/s^2/sqrt(s), imunoise.abstd + corrtime

gnss:
  leverarm_frd: [0.136, -0.301, -0.184]    # kf-gins.yaml antlever (GNSS antenna vs IMU)
  pos_stddev_fallback_m: [1, 2]

init_stddev:
  pos_init_stddev_m: 0.008    # kf-gins.yaml initposstd, max component
  vel_init_stddev_mps: 0.004    # initvelstd, max component
  rpy_init_stddev_rad_deg: 0.003    # initattstd roll/pitch
  yaw_init_stddev_rad_deg: 0.023    # initattstd yaw

score:
  leverarm_frd: [0, 0, 0]    # truth.nav/navresult.nav refer to the IMU center, same as the filter state
  ahrs: 1    # no magnetometer in this dataset, but truth roll/pitch/yaw is available -> score the IMU-only ARS too
  warmup_sec: 30
  min_epochs: 3000
  lim_att_bias_deg: 0.02
  lim_att_std_deg: 0.02
  lim_yaw_bias_deg: 0.02
  lim_yaw_std_deg: 0.05
  lim_pos_rms_m: 0.08
  lim_ars_att_bias_deg: 0.35
  lim_ars_roll_std_deg: 3.3
  lim_ars_pitch_std_deg: 3.3
  lim_ars_yaw_drift_deg_min: 0.1

inputs:
  ref: ref_kfgins.csv
