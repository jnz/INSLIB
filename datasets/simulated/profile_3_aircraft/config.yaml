# generated by Export_Demo_4.m -- groves-profile_3
# SIMULATED (Paul Groves book code, BSD). ref.csv IS a real,
# independent ground truth, so pos/att RMS are accuracy numbers.
# Filter noise model mirrors LC_KF_config; GNSS covariance
# mirrors LC_KF_config.pos_meas_SD (2.5 m) / vel_meas_SD (0.1 m/s).
name: groves-profile_3
aiding: gnss    # simulated GNSS fixes from gnss.csv
init: ref    # known truth start (simulation)
automotive_mode: 0
gyro_bias_window_sec: 3    # harness's historical implicit default, pinned explicitly (no library default exists)

imu:
  # Pinned to the library default at the time the limits in `score:` below
  # were measured: the default auto_zupt_dwell_sec has since been lowered
  # (faster ZUPT/ZARU response), but sustained unaccelerated cruise reads as
  # a gravity-only specific force with near-zero rotation rate -- the same
  # IMU signature as standing still, distinguished only by the external
  # GNSS-velocity gate, which only protects while a recent fix is cached
  # (INS_AUTOZUPT_EXT_VEL_MAX_AGE_SEC). A short dwell let a single false
  # auto-ZUPT trigger during this profile's cruise fuse a zero-velocity
  # update at ~200+ m/s, diverging the whole run instead of just biasing it.
  auto_zupt_dwell_sec: 1.0
  auto_zupt_min_interval_sec: 1.0
  rpy_pred_stddev_rad_sqrts: 1.745329252e-05    # rigid mount
  gyr_psd: 3.384637998e-11    # rad^2/s, LC_KF_config.gyro_noise_PSD
  acc_psd: 3.846815369e-06    # (m/s^2)^2/Hz, LC_KF_config.accel_noise_PSD
  gyr_bias_rw: 1.414213562e-06    # rad/s/sqrt(s), sqrt(gyro_bias_PSD)
  acc_bias_rw: 0.000316227766    # m/s^2/sqrt(s), sqrt(accel_bias_PSD)

# The IMU biases the simulator INJECTED (body FRD, units matching
# ins_get_bias_acc/gyr) -- what a converged estimate should look like, kept
# here because Export_Demo_4.m is the only other place they exist. A comment,
# not config: no tool reads them.
#   acc_bias_mps2: [0.008825985, -0.012748645, 0.00784532]    = [900, -1300, 800] ug
#   gyr_bias_rps:  [-4.36332313e-05, 6.302577854e-05, -3.878509449e-05]    = [-9.0, 13.0, -8.0] deg/hr
# NOTE scale/cross-coupling (M_a/M_g) and gyro g-sensitivity (G_g) are ALSO
# injected but NOT estimated by ins, so the estimate lands close to these
# numbers, not exactly on them.

gnss:
  leverarm_frd: [0.0, 0.0, 0.0]    # IMU and GNSS colocated (Groves)
  vel_stddev_fallback_mps: 0.1
  # The covariances in gnss.csv are the simulator's OWN noise model
  # (LC_KF_config: 2.5 m position, 0.1 m/s velocity), not a receiver's
  # self-assessment, so there is no vendor optimism here to counter and
  # the library's real-world covariance floors would only handicap the
  # filter against the reference solution. Opted out explicitly.
  pos_stddev_floor_hor_m: -1
  pos_stddev_floor_ver_m: -1
  vel_stddev_floor_hor_mps: -1
  vel_stddev_floor_ver_mps: -1
  # Same reason for the manoeuvre-dependent velocity noise: the simulator
  # emits an instantaneous velocity plus white noise, with none of the
  # measurement-interval averaging that term prices in.
  vel_noise_acc_scale_hor: -1
  vel_noise_acc_scale_ver: -1

score:
  leverarm_frd: [0.0, 0.0, 0.0]
  ahrs: 1
  warmup_sec: 10
  min_epochs: 100
  # Regression guard-rails, deliberately TIGHT (retuned 2026-07-12 after
  # the KFCore kalman_udu_predict r>n fix): position rms only ~2.5 cm
  # above the known-good run, attitude ~40-70% above it (the C and Python
  # harnesses already differ by ~20% on these sub-0.05-deg numbers), so
  # even small regressions trip a gate immediately. A trip after an
  # intentional change (or a toolchain/FMA switch shifting float32
  # results) means: inspect, then retune to the new known-good values --
  # they are NOT accuracy claims. Known-good (max of replay.c/replay.py,
  # in the per-line comments) for reference. The ARS roll stays loose:
  # it is a pure accelerometer-leveling fallback and sustained
  # coordinated turns break the leveling on this aircraft profile.
  lim_att_bias_deg: 0.05    # observed 0.028 (roll)
  lim_att_std_deg: 0.05    # observed 0.027 (roll)
  lim_yaw_bias_deg: 0.05    # observed 0.026
  lim_yaw_std_deg: 0.08    # observed 0.072
  lim_pos_rms_m: 1.42    # observed 1.394 (replay.py; replay.c 1.352)
  lim_ars_att_bias_deg: 2.8    # observed 2.232 (roll)
  lim_ars_roll_std_deg: 9.0    # observed 7.399 (leveling breaks in turns)
  lim_ars_pitch_std_deg: 0.85    # observed 0.627
  lim_ars_yaw_drift_deg_min: 2.5    # observed 1.964
  # ins must stay within this factor of the Groves textbook LC filter's
  # own position RMS vs truth (REQ-VER-016; check_simulated.py only).
  # 1.0 = the hard requirement "never worse than the textbook filter".
  lim_groves_pos_rms_factor: 1.0    # observed 0.95 (1.394 m vs 1.466 m)
